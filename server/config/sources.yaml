# Official sources crawled every night.
#
# ===================== HOW TO ADD A WEBSITE (from your phone or PC) =====================
# 1. On GitHub open this file and tap the pencil (Edit).
# 2. Copy one line at the END of the file and change it. Only 4 things are needed:
#
#    - {id: ka_forest, name: "Karnataka Forest Department", level: state, state: "Karnataka", home: "https://aranya.gov.in"}
#    - {id: nhai, name: "NHAI", level: central, home: "https://nhai.gov.in"}
#
#      id     short unique name: small letters, digits and _ only (never change it later)
#      name   shown in the app
#      level  central or state   (state sources also need  state: "<State name>")
#      home   the website's main address (https://...). Any page of the site is fine: the crawler
#             finds the recruitment / careers / vacancies pages by itself.
#    Optional: sector (defence, police, space_research, railways, banking, civil_services, ssc, psu,
#              teaching, health, postal, judiciary, engineering, other), kind (recruitment, deputation,
#              mixed), hints: ["exact vacancies page"], domains: ["other domain the site uses"]
# 3. Tap "Commit changes". Within a few minutes GitHub test-crawls the new website from the India
#    server: Actions > sources-check > the newest run shows what was found or what is wrong.
#    Notices from a new website go to Admin > Review in the app during its first week.
# To stop crawling a website, delete its line.
# ==========================================================================================

defaults:
  # Domains every source may link to (official government suffixes)
  official_suffixes: [".gov.in", ".nic.in", ".ac.in", ".res.in", ".edu.in", ".mil.in", ".org.in"]
  max_new_notices_per_source: 20
  max_listing_pages: 6
  max_age_days: 120

