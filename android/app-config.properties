# GovJob Radar app settings. These values are NOT secret (Firebase API keys identify the
# project; security comes from firebase/firestore.rules). Fill them in from the Firebase
# console as described in SETUP.md, then push — GitHub builds a new APK automatically.

# Where the nightly job feed is published (GitHub Pages of this repo)
FEED_BASE_URL=https://raviiist.github.io/govjob-radar/

# Your Gmail: only this account sees the Admin tab (must match firebase/firestore.rules)
ADMIN_EMAIL=

# Firebase console > Project settings > Your apps > Android app
FIREBASE_PROJECT_ID=
FIREBASE_APP_ID=
FIREBASE_API_KEY=
FIREBASE_SENDER_ID=

# Firebase console > Authentication > Sign-in method > Google > Web SDK configuration > Web client ID
GOOGLE_WEB_CLIENT_ID=
