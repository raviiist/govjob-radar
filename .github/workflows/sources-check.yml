name: sources-check

# Runs when you edit server/config/sources.yaml on GitHub: checks the file, then test-crawls only the
# sources you added or changed (from the India server) and shows the result on the run page.
on:
  push:
    paths: ["server/config/sources.yaml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  check:
    runs-on: self-hosted
    timeout-minutes: 120
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      AI_MAX_CALLS: "60"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Install
        run: |
          python3 -m venv "$HOME/.gjr-venv"
          "$HOME/.gjr-venv/bin/pip" install -q -r server/requirements.txt lxml playwright
          echo "$HOME/.gjr-venv/bin" >> "$GITHUB_PATH"
          "$HOME/.gjr-venv/bin/python" -m playwright install chromium || echo "::warning::browser download failed"
      - name: Check the file
        run: python -c "import sys; sys.path.insert(0,'server'); from govjob.sources import load; c=load('server/config/sources.yaml'); print(len(c['sources']), 'sources OK')"
      - name: Find added or changed sources
        id: changed
        run: |
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import subprocess, sys, yaml
          sys.path.insert(0, 'server')
          from govjob.sources import load
          load('server/config/sources.yaml')          # validates; raises a clear error if wrong
          new = {s['id']: s for s in (yaml.safe_load(open('server/config/sources.yaml')).get('sources') or [])}
          try:
              old_txt = subprocess.run(['git', 'show', 'HEAD^:server/config/sources.yaml'], capture_output=True, text=True, check=True).stdout
              old = {s['id']: s for s in (yaml.safe_load(old_txt).get('sources') or [])}
          except Exception:
              old = {}
          ids = [i for i, s in new.items() if old.get(i) != s]
          if len(ids) > 15:   # file reorganised or many added: test the first 15, the nightly run covers the rest
              ids = ids[:15]
          print('ids=' + ' '.join(ids))
          PY
      - name: Test-crawl them
        if: steps.changed.outputs.ids != ''
        env:
          RUN_EVENT: sources-check
        run: |
          python server/run_nightly.py --only ${{ steps.changed.outputs.ids }} | tee crawl.log
          {
            echo "## Test crawl of added/changed sources"
            echo '```'
            grep -E "^source |  (LIVE|REVIEW|skipped):" crawl.log || echo "(no output)"
            echo '```'
            echo "Found notices go to **Admin › Review** in the app. A FAILED line explains what is wrong."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Nothing to test
        if: steps.changed.outputs.ids == ''
        run: echo "No added or changed sources." >> "$GITHUB_STEP_SUMMARY"
