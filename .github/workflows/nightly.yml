name: nightly

# Every night ~02:11 IST: crawl official sources, read new notices with AI, check
# extensions and links, then publish the feed. Anything that goes wrong is written
# to Admin > Errors in the app.
on:
  schedule:
    - cron: "41 20 * * *"        # 20:41 UTC = 02:11 IST
  workflow_dispatch:
    inputs:
      only:
        description: "Optional: space-separated source ids to crawl (blank = all)"
        required: false
        default: ""
      on_github:
        description: "Run on GitHub's own servers instead of the India server (for testing)"
        type: boolean
        default: false

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  crawl:
    # Indian government sites block foreign servers, so the crawl runs on our own server in India
    # (Oracle Cloud, Mumbai — see server/oracle-runner-setup.sh). If that server is down the job waits
    # and Admin > Health turns red after 30 h.
    runs-on: ${{ (inputs.on_github || vars.CRAWL_ON_GITHUB == 'true') && 'ubuntu-latest' || 'self-hosted' }}
    timeout-minutes: 170
    env:
      FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
      AI_MAX_CALLS: ${{ vars.AI_MAX_CALLS || '300' }}
    steps:
      - uses: actions/checkout@v4
      - name: Install
        run: |
          python3 -m venv "$HOME/.gjr-venv"
          "$HOME/.gjr-venv/bin/pip" install -q --upgrade pip
          "$HOME/.gjr-venv/bin/pip" install -q -r server/requirements.txt pytest lxml
          echo "$HOME/.gjr-venv/bin" >> "$GITHUB_PATH"
      - name: Self-test
        run: python -m pytest -q server/tests
      - name: Crawl
        run: python server/run_nightly.py ${{ inputs.only && format('--only {0}', inputs.only) || '' }}
      - name: Report failure to Admin tab
        if: failure()
        run: python server/report_failure.py nightly

  publish:
    needs: crawl
    if: always()
    uses: ./.github/workflows/publish.yml
    secrets: inherit
