name: android

# Builds the app. Debug APK always; signed release AAB + APK when the signing
# secrets exist (ANDROID_KEYSTORE_B64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS,
# ANDROID_KEY_PASSWORD). Download them from the run's "Artifacts" section.
on:
  push:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build
        env:
          KS_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          if [ -z "$KS_B64" ]; then
            echo "No signing secrets - building unsigned debug APK only"
            ./gradlew --no-daemon assembleDebug
            exit 0
          fi
          # Tolerate spaces / line breaks pasted into the secrets.
          KS_PASS=$(printf %s "$KS_PASS" | tr -d '\r\n'); KEY_PASS=$(printf %s "$KEY_PASS" | tr -d '\r\n')
          KEY_ALIAS=$(printf %s "$KEY_ALIAS" | tr -d ' \r\n')
          printf %s "$KS_B64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/upload.jks" || { echo "::error::ANDROID_KEYSTORE_B64 is not valid base64"; exit 1; }
          echo "keystore file: $(stat -c %s "$RUNNER_TEMP/upload.jks") bytes, sha256 starts $(sha256sum "$RUNNER_TEMP/upload.jks" | cut -c1-16)"
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" >/dev/null 2>&1; then
            echo "::error::Keystore could not be opened: ANDROID_KEYSTORE_B64 is wrong/cut off, or ANDROID_KEYSTORE_PASSWORD is wrong"; exit 1; fi
          if ! keytool -list -keystore "$RUNNER_TEMP/upload.jks" -storepass "$KS_PASS" -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Alias '$KEY_ALIAS' not found: ANDROID_KEY_ALIAS must be govjobradar"; exit 1; fi
          ./gradlew --no-daemon assembleDebug assembleRelease bundleRelease \
            -Pgjr.storeFile="$RUNNER_TEMP/upload.jks" -Pgjr.storePassword="$KS_PASS" \
            -Pgjr.keyAlias="$KEY_ALIAS" -Pgjr.keyPassword="$KEY_PASS"
      - uses: actions/upload-artifact@v4
        with:
          name: GovJobRadar-builds
          path: |
            android/app/build/outputs/apk/debug/*.apk
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
